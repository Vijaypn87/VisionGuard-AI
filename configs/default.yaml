# ============================================================
# Real-Time Video Anomaly Detection — Master Configuration
# ============================================================

# ── Detector (YOLOv8) ──────────────────────────────────────
detector:
  model: "yolov8s.pt"               # Model variant: yolov8n.pt | yolov8s.pt | yolov8m.pt
  device: "cpu"                     # "auto" | "cuda:0" | "cpu"
  conf_threshold: 0.25               # Detection confidence threshold
  iou_threshold: 0.45                # NMS IoU threshold
  classes: [0, 1, 2, 3, 5, 7]       # COCO classes: person, bicycle, car, motorcycle, bus, truck
  img_size: 640                      # Input image resolution
  half: false                         # FP16 inference (GPU only)
  max_det: 100                       # Maximum detections per frame

# ── Tracker (ByteTrack) ───────────────────────────────────
tracker:
  config: "configs/bytetrack.yaml"
  track_buffer: 30                   # Frames to keep lost tracks
  match_threshold: 0.8               # IoU threshold for matching
  min_track_length: 5                # Minimum frames for a valid track

# ── Anomaly scoring (VideoMAE features + trained MIL head) ─
# The head must be trained first (python -m training.train_mil ...).
# Without weights/anomaly_head.pt the pipeline runs detection + tracking only.
anomaly:
  backbone: "MCG-NJU/videomae-base-finetuned-kinetics"  # frozen feature extractor
  head_weights: "weights/anomaly_head.pt"               # produced by training/train_mil.py
  mode: "frame"                         # "frame" (matches training) | "track" (experimental, per-object crops)
  clip_length: 16                       # consecutive frames per clip
  stride: 8                             # score a new clip every N frames
  anomaly_threshold: 0.5                # tune on validation data after training
  device: "cpu"                         # "auto" | "cpu" | "cuda:0"

# ── Video I/O ─────────────────────────────────────────────
video:
  source: 0                           # 0 = webcam | "rtsp://..." | "/path/to/video.mp4"
  width: 1280
  height: 720
  fps: 30
  buffer_size: 64                     # Frame buffer for async reading

# ── Pipeline ──────────────────────────────────────────────
pipeline:
  mode: "realtime"                    # "realtime" | "offline"
  show_display: true                  # Show OpenCV window
  save_output: true                   # Save annotated video
  output_path: "outputs/"
  log_level: "INFO"

# ── Heatmap / Visualization ──────────────────────────────
visualization:
  show_tracks: true                   # Draw tracking trajectories
  show_heatmap: true                  # Overlay anomaly heatmap
  show_scores: true                   # Show anomaly scores on bboxes
  show_fps: true                      # Display FPS counter
  trail_length: 30                    # Track trail length in frames
  normal_color: [0, 255, 0]           # Green for normal
  anomaly_color: [0, 0, 255]          # Red for anomaly
  heatmap_alpha: 0.4                  # Heatmap overlay transparency

# ── Evaluation ────────────────────────────────────────────
evaluation:
  dataset_path: "data/UCF-Crime/"
  test_split: "Temporal_Anomaly_Annotation_for_Testing_Videos.txt"
  results_dir: "results/"
  save_plots: true
